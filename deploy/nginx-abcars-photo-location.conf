# Фотографии машин: свой адрес /photo/… вместо прямой ссылки на китайское хранилище.
# Зачем: см. комментарий в conf.d/abcars-photos.conf. Кроме скорости это даёт ещё
# два выигрыша — снимки идут по уже открытому соединению с нашим сайтом (браузеру
# не нужно вторично знакомиться с чужим сервером) и сайт перестаёт зависеть от
# того, отвечает ли китайская сеть доставки прямо сейчас.
# Соцсети (Threads, Instagram) скачивают только JPEG и не понимают webp, поэтому
# рядом с обычным .webp тот же кадр доступен и как .jpg — хранилище отдаёт оба.
location ^~ /photo/ {
  access_log /var/log/nginx/abcars-photos.log abcars_photo buffer=64k flush=5s;
  if ($uri !~ "^/photo/escimg/[A-Za-z0-9/_.-]+\.(webp|jpg)$") { return 404; }
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }
  root /srv/abcars-media;
  try_files $uri @abcars_photo_origin;
  # A source/CDN failure can briefly put bad bytes behind an otherwise stable URL.
  # Let browsers recheck daily instead of pinning that response for a full year.
  add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
  add_header Access-Control-Allow-Origin "*" always;
  add_header X-Photo-Cache "STORED";
  include /etc/nginx/snippets/abcars-headers.conf;
}

location @abcars_photo_origin {
  access_log /var/log/nginx/abcars-photos.log abcars_photo buffer=64k flush=5s;
  # Наружу ходим только за фотографиями Che168 и только по адресам их вида —
  # иначе через нас можно было бы качать что угодно с чужого домена.
  if ($uri !~ "^/photo/escimg/[A-Za-z0-9/_.-]+\.(webp|jpg)$") { return 404; }
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }

  # Адрес хранилища держим в переменной: тогда nginx перепроверяет его в DNS
  # (сеть доставки меняет адреса), а не запоминает раз и навсегда при запуске.
  resolver 127.0.0.53 ipv6=off valid=300s;
  resolver_timeout 5s;
  set $photo_origin "erscglobal2.autoimg.cn";
  rewrite ^/photo/(.*)$ /$1 break;

  proxy_pass https://$photo_origin;
  proxy_http_version 1.1;
  proxy_set_header Host $photo_origin;
  proxy_set_header Connection "";
  proxy_set_header Cookie "";
  proxy_set_header Referer "";
  proxy_set_header User-Agent "Mozilla/5.0 (compatible; abcars/1.0)";
  proxy_set_header Accept-Encoding "";
  proxy_ssl_server_name on;
  proxy_ssl_name $photo_origin;
  # Хранилище иногда задумывается над кадром, которого у него нет под рукой:
  # лучше подождать, чем отдать посетителю пустую рамку.
  proxy_connect_timeout 8s;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;
  proxy_socket_keepalive on;

  proxy_cache abcars_photos;
  proxy_cache_key $uri;
  # Keep origin protection, but do not let a successful-looking bad response live
  # here for a month. Permanent, verified gallery copies still win via try_files.
  proxy_cache_valid 200 1d;
  proxy_no_cache $abcars_photo_no_cache;
  # Если один и тот же кадр запросили сразу десять посетителей, наружу уходит
  # один запрос, остальные ждут его ответа.
  proxy_cache_lock on;
  proxy_cache_lock_timeout 10s;
  # Пока обновляем протухший кадр — отдаём старый; если хранилище легло,
  # старая копия всё равно показывается.
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504 http_429;
  proxy_cache_background_update on;
  proxy_cache_revalidate on;
  proxy_ignore_headers Set-Cookie Vary Expires Cache-Control;
  proxy_hide_header Set-Cookie;
  proxy_hide_header Vary;
  proxy_hide_header Cache-Control;
  proxy_hide_header Expires;
  proxy_hide_header Strict-Transport-Security;

  gzip off;
  # Браузер перепроверяет снимок раз в сутки. Серверный кэш всё равно защищает
  # китайское хранилище, а восстановившийся кадр больше не застревает у посетителя.
  add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
  add_header Access-Control-Allow-Origin "*" always;
  # Пометка HIT/MISS — по ней видно, отдали с диска или ходили в Китай.
  add_header X-Photo-Cache $upstream_cache_status always;
  include /etc/nginx/snippets/abcars-headers.conf;
}

# ── Фото Encar (Корея), 29.09.2026 ─────────────────────────────────────────────
# Тот же принцип, что у Che168: свой адрес, копия на диске, наружу — только за
# кадрами хранилища Encar и только по адресам их вида. Размер стоит в пути
# (/photo/encar/w600/…, w1200, w1920): у хранилища размер задаётся параметрами
# запроса, а копии на диске лежат по адресу без параметров. Параметры подставляет
# nginx по бакету — те же, что в src/photo-source.js (encarResizeQuery).
location ^~ /photo/encar/ {
  access_log /var/log/nginx/abcars-photos.log abcars_photo buffer=64k flush=5s;
  if ($uri !~ "^/photo/encar/w(600|1200|1920)/[A-Za-z0-9/_.-]+\.(jpg|jpeg)$") { return 404; }
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }
  root /srv/abcars-media;
  try_files $uri @abcars_encar_origin;
  add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
  add_header Access-Control-Allow-Origin "*" always;
  add_header X-Photo-Cache "STORED";
  include /etc/nginx/snippets/abcars-headers.conf;
}

location @abcars_encar_origin {
  access_log /var/log/nginx/abcars-photos.log abcars_photo buffer=64k flush=5s;
  if ($uri !~ "^/photo/encar/w(600|1200|1920)/[A-Za-z0-9/_.-]+\.(jpg|jpeg)$") { return 404; }
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }

  resolver 127.0.0.53 ipv6=off valid=300s;
  resolver_timeout 5s;
  set $photo_origin "ci.encar.com";
  # Бакет → параметры хранилища (высота = ширина × 9/16, кадрирование по центру).
  set $encar_args "impolicy=heightRate&rh=338&cw=600&ch=338&cg=Center";
  if ($uri ~ "^/photo/encar/w1200/") { set $encar_args "impolicy=heightRate&rh=675&cw=1200&ch=675&cg=Center"; }
  if ($uri ~ "^/photo/encar/w1920/") { set $encar_args "impolicy=heightRate&rh=1080&cw=1920&ch=1080&cg=Center"; }
  rewrite ^/photo/encar/w\d+/(.*)$ /$1 break;

  proxy_pass https://$photo_origin$uri?$encar_args;
  proxy_http_version 1.1;
  proxy_set_header Host $photo_origin;
  proxy_set_header Connection "";
  proxy_set_header Cookie "";
  proxy_set_header Referer "https://www.encar.com/";
  proxy_set_header User-Agent "Mozilla/5.0 (compatible; abcars/1.0)";
  proxy_set_header Accept-Encoding "";
  proxy_ssl_server_name on;
  proxy_ssl_name $photo_origin;
  proxy_connect_timeout 8s;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;
  proxy_socket_keepalive on;

  proxy_cache abcars_photos;
  proxy_cache_key $uri;
  proxy_cache_valid 200 1d;
  proxy_no_cache $abcars_photo_no_cache;
  proxy_cache_lock on;
  proxy_cache_lock_timeout 10s;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504 http_429;
  proxy_cache_background_update on;
  proxy_cache_revalidate on;
  proxy_ignore_headers Set-Cookie Vary Expires Cache-Control;
  proxy_hide_header Set-Cookie;
  proxy_hide_header Vary;
  proxy_hide_header Cache-Control;
  proxy_hide_header Expires;
  proxy_hide_header Strict-Transport-Security;

  gzip off;
  add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
  add_header Access-Control-Allow-Origin "*" always;
  add_header X-Photo-Cache $upstream_cache_status always;
  include /etc/nginx/snippets/abcars-headers.conf;
}

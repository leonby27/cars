# Dynamic locations only. Search exemptions require both provider IP and UA.
limit_req zone=car_training_v2 burst=1 nodelay;
limit_req zone=car_audit_v1 burst=30 nodelay;
limit_req zone=car_ahrefs_v1 burst=30 nodelay;
limit_req zone=car_perplexity_v1 burst=2 nodelay;
limit_req zone=car_catalog_burst burst=30 nodelay;
limit_req zone=car_catalog_sustained_v2 burst=30 nodelay;
limit_req zone=car_public_reads burst=40 nodelay;
limit_req_status 429;
# The production error logs use nginx's default error threshold. Record the
# rejecting zone there so visitor 429s can be distinguished from crawler limits.
limit_req_log_level error;
add_header Retry-After $car_ai_retry_after always;

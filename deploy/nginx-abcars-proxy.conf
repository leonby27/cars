proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_read_timeout 30s;
proxy_connect_timeout 5s;
# Готовые ответы храним у себя ровно столько, сколько разрешает сам ответ
# (заголовок s-maxage). Пока идёт обновление, отдаём прежний — посетитель
# никогда не ждёт «просыпающийся» ответ.
proxy_cache abcars;
proxy_cache_key "$scheme$host$request_method$request_uri";
proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock on;
add_header X-Cache-Status $upstream_cache_status always;
include /etc/nginx/snippets/abcars-headers.conf;

# Частота запросов к страницам и /api с одного адреса. Поисковики от ограничения
# освобождены (см. /etc/nginx/conf.d/abcars-bots.conf); превышение получает 429.
limit_req zone=abcars_pages burst=300 nodelay;
limit_conn abcars_conns 64;

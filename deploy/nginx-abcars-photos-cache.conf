# Хранилище фотографий машин лежит в Китае и раздаётся через чужую сеть доставки.
# Пока снимок у неё «горячий», он приходит за 60 мс, но первый запрос любого нового
# кадра ждёт ответа 0,8–1,1 с — именно поэтому фотографии «медленно грузятся при
# первом заходе». Держим свою копию: nginx один раз забирает кадр у китайцев и
# дальше отдаёт его с диска всем посетителям — со скоростью обычной статики сайта.
#
# Ключ кэша — сам адрес: у каждого размера снимка свой файл. Кладём в отдельную
# область, чтобы фотографии не вытесняли кэш готовых страниц (зона abcars).
#
# Размер зоны, 28.08.2026. Ночной прогрев держит у себя три размера первого снимка
# каждой машины: исходник продавца для большого фото (71 КБ), 900 для карточки на
# компьютере (35 КБ) и 600 для карточки на телефоне (19 КБ) — на 105 тысяч машин это
# около 13 ГБ. Остальное набегает от посетителей: прочие снимки галереи и миниатюры.
# Отсюда 20 ГБ при 48 ГБ диска (на 28.08.2026 занято 15 ГБ вместе с базой и копиями).
# Переполнения не бывает: дойдя до предела, nginx удаляет самые давние файлы.
proxy_cache_path /var/cache/nginx/abcars-photos levels=2:2 keys_zone=abcars_photos:60m max_size=20g inactive=30d use_temp_path=off;

# Копия того, что стоит на сервере: /etc/nginx/conf.d/abcars-photos.conf.
# Пара к нему — nginx-abcars-photo-location.conf (там же, snippets/), он
# подключается строкой include в snippets/abcars-site.conf перед location /assets/.
# Выкладка сайта эти файлы не трогает: они живут в настройках nginx, а не в репозитории.

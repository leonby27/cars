# Временный кэш: оригиналы, миниатюры и кадры за пределами первых пяти.
# Первые пять снимков в 600px теперь постоянно лежат в /srv/abcars-media.
# Их nginx отдаёт через try_files; они не вытесняются из временного кэша.
# На диске 48 ГБ: временным копиям оставляем 2 ГБ, постоянные — только 600px.
# 28.09.2026 урезано с 8 ГБ: за полтора дня из временной копии ушло ~6% фото,
# остальное отдало постоянное хранение или источник, а место нужно под Guazi.
# Рабочий процесс приостанавливает новые записи, если свободно меньше 5 ГБ.
proxy_cache_path /var/cache/nginx/abcars-photos levels=2:2 keys_zone=abcars_photos:60m max_size=2g inactive=30d use_temp_path=off;

# Записываем только настоящие изображения с успешным статусом. В частности,
# HTML с ошибкой источника не должен становиться сохранённой «фотографией».
map "$upstream_status:$upstream_http_content_type" $abcars_photo_no_cache {
  default 1;
  ~^200:image/ 0;
}

# No visitor identifiers, cookies, query strings or referrers in photo diagnostics.
# nginx's existing /var/log/nginx/*.log rotation also covers this file.
log_format abcars_photo escape=json '{"at":"$time_iso8601","path":"$uri",'
  '"status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,'
  '"cache":"$sent_http_x_photo_cache","upstream_status":"$upstream_status",'
  '"upstream":"$upstream_addr","connect":"$upstream_connect_time",'
  '"headers":"$upstream_header_time","response":"$upstream_response_time"}';

map $status $abcars_photo_client_cache {
  default "";
  200 "public, max-age=604800, stale-while-revalidate=86400";
  206 "public, max-age=604800, stale-while-revalidate=86400";
  304 "public, max-age=604800, stale-while-revalidate=86400";
  503 "no-store";
}

# This listener is accessible only from the server. The public locations
# check disk and cache first. Cold fetches from both origins share 8 slots
# across workers, even if each request came from a different visitor.
limit_conn_zone $server_name zone=abcars_photo_origin:1m;
server {
  listen 127.0.0.1:8791;
  server_name abcars_photo_fetch;
  limit_conn abcars_photo_origin 8;
  limit_conn_status 503;
  error_page 503 = @photo_busy;
  access_log off;

  resolver 127.0.0.53 ipv6=off valid=300s;
  resolver_timeout 5s;
  proxy_http_version 1.1;
  proxy_set_header Host $photo_origin;
  proxy_set_header Connection "";
  proxy_set_header Cookie "";
  proxy_set_header Referer $photo_referer;
  proxy_set_header User-Agent "Mozilla/5.0 (compatible; abcars/1.0)";
  proxy_set_header Accept-Encoding "";
  proxy_ssl_server_name on;
  proxy_ssl_name $photo_origin;
  proxy_connect_timeout 8s;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;
  proxy_socket_keepalive on;

  location ^~ /photo/escimg/ {
    if ($uri !~ "^/photo/escimg/[A-Za-z0-9/_.-]+\.(webp|jpg)$") { return 404; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    set $photo_origin "erscglobal2.autoimg.cn";
    set $photo_referer "";
    rewrite ^/photo/(.*)$ /$1 break;
    proxy_pass https://$photo_origin$uri;
  }

  location ^~ /photo/encar/ {
    if ($uri !~ "^/photo/encar/v2/w(600|1200|1920)/[A-Za-z0-9/_.-]+\.[jJ][pP][eE]?[gG]$") { return 404; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    set $photo_origin "ci.encar.com";
    set $photo_referer "https://www.encar.com/";
    set $encar_args "impolicy=heightRate&rh=338&cw=600&ch=338&cg=Center";
    if ($uri ~ "^/photo/encar/v2/w1200/") { set $encar_args "impolicy=heightRate&rh=675&cw=1200&ch=675&cg=Center"; }
    if ($uri ~ "^/photo/encar/v2/w1920/") { set $encar_args "impolicy=heightRate&rh=1080&cw=1920&ch=1080&cg=Center"; }
    set $encar_path "";
    if ($uri ~ "^/photo/encar/v2/w[0-9]+(/.*)$") { set $encar_path $1; }
    proxy_pass https://$photo_origin$encar_path?$encar_args;
  }

  location @photo_busy {
    add_header Retry-After 2 always;
    add_header Cache-Control "no-store" always;
    return 503;
  }

  location / { return 404; }
}

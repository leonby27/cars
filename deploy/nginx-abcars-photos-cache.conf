# Временный кэш: оригиналы, миниатюры и кадры за пределами первых пяти.
# Первые пять снимков в 600px теперь постоянно лежат в /srv/abcars-media.
# Их nginx отдаёт через try_files; они не вытесняются из временного кэша.
# На диске 48 ГБ: временным копиям оставляем 8 ГБ, постоянные — только 600px.
# Рабочий процесс приостанавливает новые записи, если свободно меньше 5 ГБ.
proxy_cache_path /var/cache/nginx/abcars-photos levels=2:2 keys_zone=abcars_photos:60m max_size=8g inactive=30d use_temp_path=off;

# Записываем только настоящие изображения с успешным статусом. В частности,
# HTML с ошибкой источника не должен становиться сохранённой «фотографией».
map "$upstream_status:$upstream_http_content_type" $abcars_photo_no_cache {
  default 1;
  ~^200:image/ 0;
}

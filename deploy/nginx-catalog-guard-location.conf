# Access phase runs before public proxy-cache hits. Only explicit denial blocks.
auth_request /_catalog_guard_auth;
auth_request_set $catalog_guard_session_cookie $upstream_http_x_guard_session;
auth_request_set $catalog_guard_session_cache $upstream_http_x_guard_session_cache;
auth_request_set $catalog_guard_reason $upstream_http_x_guard_reason;
# Generated per visitor after the shared upstream cache, never cached in it.
add_header Set-Cookie $catalog_guard_session_cookie always;
add_header Cache-Control $catalog_guard_session_cache always;
error_page 403 = @catalog_guard_blocked;
# HTML only: install the recovery dialog without rebuilding either application.
proxy_set_header Accept-Encoding "";
sub_filter '</head>' '<script src="/_catalog-check/client.js" defer></script></head>';
sub_filter_once on;

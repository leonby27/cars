# Shared origin protection for abcars.by and abdrive.ru (http context).
# Official provider networks plus forward-confirmed Yandex DNS are refreshed
# outside the request path. User-Agent alone never grants a search exemption.
include /etc/nginx/snippets/car-search-networks.conf;

map $http_user_agent $car_search_family {
    default "";
    ~*(googlebot|google-inspectiontool|storebot-google|adsbot-google|googleother|google-cloudvertexbot|gemini-deep-research) google;
    ~*(bingbot|bingpreview|adidxbot) bing;
    ~*(yandex|yadirectfetcher) yandex;
    ~*applebot/ apple;
    ~*duckduckbot duck;
    ~*(oai-searchbot|chatgpt-user|oai-adsbot) openai;
    ~*(perplexitybot|perplexity-user) perplexity;
    ~*(claude-searchbot|claude-user) claude;
}
map "$car_search_family:$car_net_google:$car_net_bing:$car_net_yandex:$car_net_apple:$car_net_duck:$car_net_openai:$car_net_perplexity:$car_net_claude" $car_verified_search {
    default 0;
    ~^google:1: 1;
    ~^bing:[01]:1: 1;
    ~^yandex:[01]:[01]:1: 1;
    ~^apple:[01]:[01]:[01]:1: 1;
    ~^duck:[01]:[01]:[01]:[01]:1: 1;
    ~^openai:[01]:[01]:[01]:[01]:[01]:1: 1;
    ~^perplexity:[01]:[01]:[01]:[01]:[01]:[01]:1: 1;
    ~^claude:[01]:[01]:[01]:[01]:[01]:[01]:[01]:1$ 1;
}
# Only the server's own loopback address bypasses visitor budgets, never XFF.
# Internal warmers use the public origin from this machine's own address too.
geo $car_internal_address {
    default 0;
    127.0.0.0/8 1;
    ::1/128 1;
    5.23.48.128/32 1;
}
map "$car_internal_address:$car_verified_search" $car_read_address {
    default $binary_remote_addr;
    ~^1: "";
    ~:1$ "";
}

# A verified search crawler can still exceed origin capacity. Share one budget
# across PerplexityBot's workers and both sites, without limiting user fetches
# or letting a forged agent consume the verified crawler's allowance.
map "$car_internal_address:$car_verified_search:$car_search_family:$http_user_agent" $car_perplexity_crawler {
    default "";
    ~*^0:1:perplexity:.*perplexitybot/ perplexity;
}
map "$request_method:$uri" $car_expensive_crawl {
    default 0;
    ~^(GET|HEAD):/(cars|catalog|models|api/(cars|catalog|pages|model-facts|model-catalog|brand-guide|market/compare))(/|$) 1;
}
map "$car_perplexity_crawler:$car_expensive_crawl" $car_perplexity_reads {
    default "";
    perplexity:1 perplexity;
}
limit_req_zone $car_perplexity_reads zone=car_perplexity_v1:1m rate=20r/m;


# Confirmed systematic exporter observed 2026-10-02. Scoped to public reads;
# expires automatically at 2026-10-04 00:00 UTC to avoid a permanent residential-IP ban.
map "$time_iso8601:$remote_addr" $car_confirmed_exporter {
    default 0;
    ~^2026-10-0[23]T.*:37\.214\.32\.151$ 1;
}
map "$car_confirmed_exporter:$car_verified_search:$request_method:$uri" $car_export_denied {
    default 0;
    ~^1:0:(GET|HEAD):/(cars|catalog|models|feeds|api/(cars|catalog|pages|model-facts|market/compare))(/|$) 1;
}

# Commercial SEO crawlers / bulk scraping tools. Do not include search crawlers
# or browser version strings here; browser-looking exporters hit IP budgets.
map $http_user_agent $car_blocked_bot {
    default 0;
    ~*(serankingbacklinksbot|semrushbot|serpstatbot|dataforseobot|mj12bot|dotbot|blexbot|barkrowler|zoominfobot|megaindex|seekport|bytespider|diffbot|omgili|imagesift|petalbot|scrapy|python-requests|go-http-client|node-fetch|libwww-perl|httrack|wpbot|nettle|zgrab|masscan) 1;
}
map $http_user_agent $car_crawl_family {
    default "";
    # Site Explorer / Yep and Site Audit have independent bounded allowances.
    ~*ahrefsbot ahrefs;
    # Independent audit budget, shared across its IPs, workers and both sites.
    ~*ahrefssiteaudit ahrefs_audit;
    ~*gptbot gptbot;
    ~*meta-externalagent meta;
    ~*(claudebot|anthropic-ai|claude-web) claude_training;
    ~*ccbot commoncrawl;
    ~*amazonbot amazon;
    ~*cohere-ai cohere;
}
# Cheap build assets and robots.txt do not consume crawl allowance; source
# photos do, including the nginx stored/origin locations outside the app proxy.
map "$uri:$car_crawl_family" $car_limited_crawler {
    default $car_crawl_family;
    ~^/(assets|fonts|brands|services|abdrive|social|trust-strip|illustrations|flags|videos)/ "";
    ~^/robots\.txt: "";
    ~^/(favicon|apple-touch-icon) "";
}
map $car_limited_crawler $car_ai_crawler {
    default $car_limited_crawler;
    ahrefs "";
    ahrefs_audit "";
}
map $car_limited_crawler $car_ahrefs_crawler {
    default "";
    ahrefs ahrefs;
}
map $car_limited_crawler $car_audit_crawler {
    default "";
    ahrefs_audit ahrefs_audit;
}
# A global budget per training/mixed-use crawler across all IPs and both sites.
# New zone name permits a graceful reload from the old 30r/m zone.
limit_req_zone $car_ai_crawler zone=car_training_v2:1m rate=20r/m;
# Site Explorer renders pages too. Share its budget across IPs and domains,
# independently of the Site Audit and training allowances.
limit_req_zone $car_ahrefs_crawler zone=car_ahrefs_v1:1m rate=60r/m;
# Audits need several fetches to verify and render one page. Keep a separate
# global allowance so they can complete without raising other crawler budgets.
limit_req_zone $car_audit_crawler zone=car_audit_v1:1m rate=60r/m;

# Normalized URI closes percent-encoding and direct /api/pages/* bypasses.
# These maps are lazy: named BY rewrites arrive as /api/pages/car|catalog.
map "$request_method:$uri" $car_catalog_address {
    default "";
    ~^(GET|HEAD):/api/(cars|catalog|cars/summary|market/compare|pages/catalog)/?$ $car_read_address;
}
map "$request_method:$uri" $car_public_address {
    default "";
    ~^(GET|HEAD):/(cars|catalog|api/(cars|catalog|pages|model-facts|market/compare))(/|$) $car_read_address;
}
# Quick filters / normal initial page bursts fit within these allowances.
# Changing UA, query parameters or domain cannot reset the shared IP counter.
limit_req_zone $car_catalog_address zone=car_catalog_burst:10m rate=60r/m;
limit_req_zone $car_catalog_address zone=car_catalog_sustained_v2:10m rate=12r/m;
limit_req_zone $car_public_address zone=car_public_reads:10m rate=120r/m;
map $limit_req_status $car_ai_retry_after {
    default "";
    REJECTED "10";
}

# Applied inside the general robots group only for Ahrefs requests, preserving
# every private-path restriction and working with both older and future builds.
map $http_user_agent $car_audit_robots_delay {
    default "";
    ~*ahrefsbot "Crawl-delay: 1\n";
    ~*ahrefssiteaudit "Crawl-delay: 1\n";
}

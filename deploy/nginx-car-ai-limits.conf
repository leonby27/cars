# http context. One budget per crawler across both sites and all its IPs.
# This is traffic classification, not identity verification; a spoofed bot UA
# receives the same limit, never an exemption. Other agents have an empty key.
map $http_user_agent $car_ai_crawler {
    default "";
    ~*gptbot gptbot;
    ~*meta-externalagent meta;
    ~*claudebot claude;
}
limit_req_zone $car_ai_crawler zone=car_ai_crawlers:1m rate=30r/m;
map $limit_req_status $car_ai_retry_after {
    default "";
    REJECTED "2";
}

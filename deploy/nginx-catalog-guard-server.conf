location = /_catalog_guard_auth {
  internal;
  auth_request off;
  proxy_pass http://127.0.0.1:8790/check;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header X-Guard-IP $remote_addr;
  proxy_set_header X-Guard-URI $request_uri;
  proxy_set_header X-Guard-Method $request_method;
  proxy_set_header X-Guard-Exempt "$car_internal_address$car_verified_search";
  proxy_set_header Cookie $http_cookie;
  proxy_cache off;
  proxy_connect_timeout 100ms;
  proxy_read_timeout 500ms;
  proxy_intercept_errors on;
  error_page 500 502 503 504 = @catalog_guard_allow;
}
location @catalog_guard_allow {
  auth_request off;
  return 204;
}
location @catalog_guard_blocked {
  auth_request off;
  rewrite ^ /blocked break;
  proxy_pass http://127.0.0.1:8790;
  proxy_set_header X-Guard-URI $request_uri;
  proxy_set_header X-Guard-Reason $catalog_guard_reason;
  proxy_cache off;
  add_header Set-Cookie $catalog_guard_session_cookie always;
}
# Recovery code stays available even when the guard service is down.
location = /_catalog-check/client.js {
  auth_request off;
  alias /usr/local/lib/car-catalog-guard/catalog-guard-client.js;
  default_type text/javascript;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options nosniff always;
}
location ^~ /_catalog-check {
  auth_request off;
  client_max_body_size 4k;
  proxy_connect_timeout 100ms;
  proxy_read_timeout 2s;
  proxy_pass http://127.0.0.1:8790;
  proxy_set_header X-Guard-IP $remote_addr;
  proxy_set_header X-Guard-Host $host;
  proxy_set_header Origin $http_origin;
  proxy_set_header Cookie $http_cookie;
  proxy_cache off;
  add_header Cache-Control "no-store" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Frame-Options SAMEORIGIN always;
}

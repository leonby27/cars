server {
    listen 80;
    server_name abdrive.ru www.abdrive.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/abdrive-acme;
        try_files $uri =404;
    }
    location / { return 301 https://abdrive.ru$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name www.abdrive.ru;
    ssl_certificate /etc/letsencrypt/live/abdrive.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abdrive.ru/privkey.pem;
    return 301 https://abdrive.ru$request_uri;
}
server {
    listen 443 ssl http2;
    server_name abdrive.ru;
    ssl_certificate /etc/letsencrypt/live/abdrive.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abdrive.ru/privkey.pem;
    access_log /var/log/nginx/abdrive.access.log;
    error_log /var/log/nginx/abdrive.error.log;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}

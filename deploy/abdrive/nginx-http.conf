# Independent host. Never include the Belarus site snippet here.
server {
    listen 80;
    server_name abdrive.ru www.abdrive.ru;
    access_log /var/log/nginx/abdrive.access.log;
    error_log /var/log/nginx/abdrive.error.log;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/abdrive-acme;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}

# Заголовки безопасности — общие для всего сайта. Вынесены в отдельный файл,
# потому что nginx устроен так: стоит в location появиться своему add_header
# (например, про кэш), как ВСЕ унаследованные add_header отменяются. Поэтому этот
# файл подключается везде, где есть свои add_header, и на уровне сервера.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://yastatic.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com https://*.yandex.ru https://yastatic.net wss://mc.yandex.ru wss://mc.yandex.com https://www.google-analytics.com https://*.google-analytics.com; frame-src 'self' https://yandex.ru https://*.yandex.ru https://yandex.by https://*.yandex.by; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Полгода ходить на сайт только по https. Безопасно: http и так навсегда
# перенаправлён на https, сертификат продлевается сам.
add_header Strict-Transport-Security "max-age=15552000" always;

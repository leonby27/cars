# Роботы и ограничение частоты запросов для abcars.by.
#
# Задача — не пускать тех, кто вычитывает сайт оптом: сборщиков данных для обучения
# ИИ и SEO-сервисы, которые обходят каталог целиком. 25.08.2026 один такой сборщик
# сделал 25 тысяч запросов за сутки — две трети всей работы сервера.
#
# Поисковиков здесь нет намеренно: Google, Яндекс, Bing, Apple, DuckDuckGo, а также
# ChatGPT и Perplexity, которые приводят людей по ссылкам, ходят по сайту как раньше.
# Ниже они ещё и освобождены от ограничения частоты.
map $http_user_agent $abcars_blocked_bot {
  default 0;
  "~*(bytespider|diffbot|omgili|imagesift|ahrefsbot|semrushbot|serpstatbot|dataforseobot|mj12bot|dotbot|blexbot|barkrowler|zoominfobot|petalbot|megaindex|seekport|scrapy|python-requests|go-http-client|node-fetch|libwww-perl|httrack|wpbot|nettle|zgrab|masscan)" 1;
}

# Ключ, по которому считается частота запросов. Пустой ключ снимает ограничение —
# поисковикам и предпросмотру ссылок в мессенджерах не мешаем совсем, остальных
# считаем по адресу, с которого пришёл запрос.
map $http_user_agent $abcars_limit_key {
  default $binary_remote_addr;
  "~*(googlebot|google-inspectiontool|storebot-google|adsbot-google|bingbot|yandex|applebot|duckduckbot|oai-searchbot|chatgpt-user|perplexitybot|mail\.ru_bot|telegrambot|whatsapp|facebookexternalhit|twitterbot|slackbot|linkedinbot|vkshare|discordbot)" "";
}

# Ограничение считается только для страниц и /api — то есть для той работы, которую
# делает Node. Картинки, шрифты и готовые файлы nginx отдаёт сам, их не ограничиваем.
#
# 28.08.2026 порог поднят с 30 r/s и запаса 100 до 60 r/s и запаса 300. Прежний
# отказал живому посетителю: главная делает 18 запросов к /api за загрузку, и
# несколько быстрых обновлений подряд выбрали лимит — человек увидел «идут
# технические работы», а кнопка «обновить» только продлевала отказ.
#
# Оптовых обходчиков это не отпускает: они идут медленно (25 тысяч запросов за
# сутки — меньше одного в секунду) и попадаются на список имён выше, а не сюда.
# Здесь остаётся только защита от наплыва. Пароли и вход считаются отдельно в самом
# сайте (10 попыток входа за 10 минут, 5 регистраций в час) — их это не касается.
#
# Запас нарочно большой ещё и потому, что за одним адресом может сидеть не один
# человек, а целый офис или подсеть мобильного оператора.
limit_req_zone $abcars_limit_key zone=abcars_pages:10m rate=60r/s;
limit_conn_zone $abcars_limit_key zone=abcars_conns:10m;
limit_req_status 429;
limit_conn_status 429;

# Сборщики текстов для обучения моделей. С 18.09.2026 они не заблокированы, а
# ограничены по скорости.
#
# Почему открыли: переходы людей из ChatGPT за две недели выросли с одного-двух в
# день до двух десятков. Обучающий обход — единственный способ попасть в ответ
# чат-бота, когда тот отвечает из памяти и не идёт в поиск. Пока эти роботы были
# закрыты, сослаться на нас модель могла только через живой поиск.
#
# Почему не просто открыли: 25.08.2026 один такой сборщик сделал 25 тысяч запросов
# за сутки — две трети всей работы сервера. Поэтому им выделена своя полоса: 2
# запроса в секунду с запасом 20, то есть обойти сайт они успеют за несколько
# суток, а в пик не помешают живым посетителям. Пустой ключ у всех остальных —
# значит обычных людей и поисковиков эта полоса не касается вовсе.
#
# Bytespider и PetalBot сюда не входят и остаются заблокированными выше: обходят
# агрессивно, а выдача у них китайская — посетителей из Беларуси не приносит.
map $http_user_agent $abcars_ai_bot {
  default "";
  "~*(claudebot|anthropic-ai|claude-web|claude-searchbot|gptbot|ccbot|google-extended|applebot-extended|cohere-ai|meta-externalagent|amazonbot)" $binary_remote_addr;
}
limit_req_zone $abcars_ai_bot zone=abcars_ai:10m rate=2r/s;

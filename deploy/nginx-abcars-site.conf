# Тело сайта abcars.by: статику отдаёт nginx, страницы каталога, разделов,
# обзоров моделей и машин собирает Node-сервер в момент запроса (он же — /api).
root /srv/abcars/dist/client;
index index.html;

# Оптовых обходчиков сайта (сборщики данных для ИИ, SEO-сервисы) дальше не пускаем:
# список и причина — в /etc/nginx/conf.d/abcars-bots.conf. Поисковики не затронуты.
if ($abcars_blocked_bot) { return 403; }

client_max_body_size 2m;
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

# Brotli — сжатие плотнее gzip примерно на 15–20%; браузеры просят его сами.
# brotli_static сначала ищет готовый файл .br рядом с оригиналом (их кладёт
# выкладка, они сжаты на максимум), а если файла нет — жмёт на лету.
brotli on;
brotli_comp_level 6;
brotli_min_length 1024;
brotli_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
brotli_static on;

include /etc/nginx/snippets/abcars-headers.conf;

# Адреса без косой черты на конце — как отвечал Vercel.
rewrite ^/(.*)/$ /$1 permanent;

location = /about { return 301 /how-it-works; }
# 18.09.2026 растаможка и калькулятор сведены в одну страницу: они отвечали на один
# и тот же запрос и делили его между собой в поиске.
location = /calculator { return 301 /customs; }
# Вопросы живут на странице «О сервисе» (приложение уводит туда же); отдельная страница
# /faq была только текстом для робота — с 26.09.2026 постоянный переброс.
location = /faq { return 301 /how-it-works#faq; }

# Legal documents use the browser PDF viewer, including old bookmarked URLs.
location = /privacy { return 302 /documents/privacy-policy.pdf; }
location = /terms { return 302 /documents/terms-of-use.pdf; }
location ^~ /documents/ {
  types { application/pdf pdf; }
  add_header Content-Disposition "inline";
  add_header Cache-Control "public, max-age=0, must-revalidate";
  include /etc/nginx/snippets/abcars-headers.conf;
  try_files $uri =404;
}

include /etc/nginx/snippets/abcars-photo-location.conf;

# Файлы сборки: имя каждого содержит отпечаток содержимого, поэтому при каждой
# выкладке появляются новые имена, а прежние исчезают. Записи Вебвизора и вкладки,
# открытые до выкладки, продолжают просить старые имена — их отдаём из архива
# /srv/abcars/asset-archive (его пополняет abcars-deploy.sh).
location /assets/ { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; add_header Access-Control-Allow-Origin "*"; include /etc/nginx/snippets/abcars-headers.conf; try_files $uri @assets_archive; }
location @assets_archive { root /srv/abcars/asset-archive; expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; add_header Access-Control-Allow-Origin "*"; include /etc/nginx/snippets/abcars-headers.conf; try_files $uri @assets_style_fallback; }
# Совсем старого файла стилей в архиве уже нет (архив завели 28.08.2026) — отдаём
# нынешний. Для записей Вебвизора это лучше, чем страница совсем без оформления;
# кэшируем на час, чтобы подмена не осела у посетителей надолго.
location @assets_style_fallback {
  root /srv/abcars/asset-archive;
  expires 1h;
  add_header Cache-Control "public, max-age=3600";
  add_header Access-Control-Allow-Origin "*";
  include /etc/nginx/snippets/abcars-headers.conf;
  rewrite ^/assets/[^/]*\\.css$ /assets/latest-style.css break;
  try_files $uri =404;
}
location /fonts/  { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; add_header Access-Control-Allow-Origin "*"; include /etc/nginx/snippets/abcars-headers.conf; try_files $uri =404; }

# Логотипы, значки марок и прочие картинки в корне сборки: имена у них без
# отпечатка содержимого, поэтому кэш недельный, а не вечный. Сюда не попадают
# /assets/, /fonts/ (совпадение по префиксу выше сильнее регулярного только
# при ^~, поэтому расширения файлов оттуда здесь не перечислены) и /cars/ (^~).
location ~* \.(svg|jpg|jpeg|png|webp|avif|ico)$ { expires 7d; add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400"; include /etc/nginx/snippets/abcars-headers.conf; try_files $uri =404; }

location = /analytics { add_header X-Robots-Tag "noindex, nofollow, noarchive" always; try_files /analytics/index.html =404; }
location = /analytics/ { add_header X-Robots-Tag "noindex, nofollow, noarchive" always; try_files /analytics/index.html =404; }
location ^~ /orders/ { try_files /private.html =404; }

location = /catalog { proxy_pass http://abcars_app/api/pages/catalog; include /etc/nginx/snippets/abcars-proxy.conf; }
location ^~ /catalog/ {
  rewrite ^/catalog/(.+)$ /api/pages/catalog?slug=$1 break;
  proxy_pass http://abcars_app;
  include /etc/nginx/snippets/abcars-proxy.conf;
}

# Журнал, инструменты и справочные страницы с 26.09.2026 рисует Node той же разметкой
# приложения, что и браузер (server/static-page.mjs): шапку страницы берёт из файла
# сборки, содержимое рисует в момент запроса. Node недоступен или ответил ошибкой —
# отдаём файл сборки как раньше (@static_page), страница не пропадает.
location ~ ^/(blog(/[a-z0-9-]+)?|how-it-works|contacts|customs|delivery-cost|ev-quota|range|price-belarus|china-brands)/?$ {
  # Адрес запроса не переписываем (переменная прямо в proxy_pass): запасное правило
  # ниже ищет файл сборки по исходному $uri, а после rewrite там был бы адрес /api/….
  proxy_pass http://abcars_app/api/pages/static?path=$uri&$args;
  include /etc/nginx/snippets/abcars-proxy.conf;
  proxy_intercept_errors on;
  error_page 404 500 502 503 504 = @static_page;
}
# Главная — так же (на ней блок журнала с датами «N дней назад»); запасной ответ —
# собранный файл главной, в нём уже готовая разметка (scripts/prerender-home.mjs).
location = / {
  proxy_pass http://abcars_app/api/pages/static?path=/&$args;
  include /etc/nginx/snippets/abcars-proxy.conf;
  proxy_intercept_errors on;
  error_page 404 500 502 503 504 = @static_page;
}
# Указатель моделей — точным правилом: рядом стоит `location ^~ /models/` с proxy_pass,
# и без точного правила nginx сам отвечает на «/models» перебросом на «/models/».
location = /models {
  proxy_pass http://abcars_app/api/pages/static?path=/models&$args;
  include /etc/nginx/snippets/abcars-proxy.conf;
  proxy_intercept_errors on;
  error_page 404 500 502 503 504 = @static_page;
}
location @static_page {
  error_page 404 /404.html;
  try_files $uri/index.html =404;
}
location ^~ /models/ {
  rewrite ^/models/(.+)$ /api/pages/model?slug=$1 break;
  proxy_pass http://abcars_app;
  include /etc/nginx/snippets/abcars-proxy.conf;
}

# Под /cars/ лежат и картинки сборки, и адреса машин: файл — если есть, иначе Node.
location ^~ /cars/ { try_files $uri @car_page; }
location @car_page {
  rewrite ^/cars/(.+)$ /api/pages/car?id=$1 break;
  proxy_pass http://abcars_app;
  include /etc/nginx/snippets/abcars-proxy.conf;
}

location /api/ {
  proxy_pass http://abcars_app;
  include /etc/nginx/snippets/abcars-proxy.conf;
}

# Личные разделы приложения (/favorites, /login, /account и прочие) своих файлов-заглушек
# не лишены: их кладёт сборка (privateRoutes в scripts/generate-seo-pages.mjs), поэтому
# правило ниже находит их обычным `$uri/index.html` и отдельного разрешения им не нужно.

# Адрес, которого нет, отвечает «страницы нет» и показывает страницу 404 из сборки.
# До 30.08.2026 здесь стояло `/index.html`: любой неизвестный адрес — опечатка,
# чужая битая ссылка, перебор адресов роботом — отдавал главную с кодом «страница
# найдена». Первоисточником у неё указана главная, поэтому в выдачу такие адреса не
# попадали, но обход на них тратился, а битые ссылки выглядели рабочими.
location / {
  error_page 404 /404.html;
  try_files $uri $uri/index.html =404;
}
# Саму страницу 404 по прямому адресу не отдаём: она нужна только как ответ.
location = /404.html { internal; }

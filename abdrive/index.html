      (() => {
        // Яндекс.Метрика считает живых посетителей. Номер лежит в window.__ym:
        // приложение берёт его оттуда для переходов внутри сайта.
        // `/analytics` — внутренняя CRM, а не страница сайта. На прямом входе не
        // создаём даже очередь счётчика: ни просмотр, ни Webvisor не должны начаться.
        const page = location.pathname.replace(/\/+$/, '') || '/';
        if (page === '/analytics' || page.startsWith('/analytics/')) return;
        const host = location.hostname;
        if (/^(localhost|127\.0\.0\.1|\[?::1\]?|.*\.local)$/i.test(host) || /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(host)) return;
        // Свои заходы с обычного адреса сайта тоже можно не считать: откройте любую
        // страницу с добавкой ?nocount=1 — браузер запомнит это насовсем и счётчик в нём
        // больше не подключится. Вернуть учёт — ?nocount=0. Метка живёт в самом браузере,
        // поэтому её нужно поставить отдельно на каждом устройстве.
        try {
          const choice = new URLSearchParams(location.search).get('nocount');
          if (choice === '1') localStorage.setItem('nocount', '1');
          else if (choice === '0') localStorage.removeItem('nocount');
          if (localStorage.getItem('nocount') === '1') return;
        } catch (error) {
          // Приватный режим может запрещать хранилище — тогда считаем как обычно.
        }
        // Браузеры, которыми управляет программа (автоматические проверки, роботы,
        // мои собственные заходы через такой браузер), сами о себе сообщают — их
        // в статистику тоже не берём.
        if (navigator.webdriver || /bot|claude\/|crawl|spider|slurp|scrape|headless|phantom|puppeteer|playwright|selenium|lighthouse|pagespeed|preview|fetcher|archiver|monitor/i.test(navigator.userAgent)) return;

        // на телефоне tag.js занимает основной поток 2,2 секунды — вшестеро дольше всего
        // нашего кода, — и всё это время страница не может дорисоваться. Заходы при этом
        // не теряются: очередь ждёт скрипт, а сами счётчики подключаются после оживления страницы, по одному
        // и в свободное от отрисовки время (src/counter-loader.js).
        window.ym = window.ym || function(){(window.ym.a = window.ym.a || []).push(arguments)};
        window.ym.l = 1 * new Date();
        ym(113330854, 'init', {ssr:true, webvisor:true, clickmap:true, ecommerce:"dataLayer", referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});

        const src = 'https://mc.yandex.ru/metrika/tag.js?id=113330854';
        let started = false;
        const startCounter = () => {
          if (started || window.__ym !== 113330854) return;
          started = true;
          const tag = document.createElement('script');
          tag.async = 1;
          tag.src = src;
          return new Promise((resolve) => {
            const timeout = setTimeout(resolve, 10000);
            tag.onload = tag.onerror = () => { clearTimeout(timeout); resolve(); };
            document.head.appendChild(tag);
          });
        };
        (window.__counterQueue ||= []).push(startCounter);
      })();
    </script><script id="google-analytics">

# Замер доступа к источнику с чужого адреса. Запускается только руками (кнопкой
# в GitHub или `gh workflow run source-probe.yml`), по расписанию не ходит.
#
# Зачем: с нашего сервера в Петербурге запас источника за день истощается, и
# непонятно, это общее правило или метка на нашем адресе. Машина GitHub стоит в
# другом облаке и с другим адресом — сравнение отвечает на вопрос, не платя за
# железо и ничего не перенося.
name: Замер источника с чужого адреса

on:
  workflow_dispatch:
    inputs:
      list:
        description: "Срез источника (по умолчанию Volkswagen с нашими фильтрами)"
        required: false
        default: "brandid=1&min_price=15&max_price=100&min_regdate=2022&sort=2"
      cap:
        description: "Сколько страниц считать достаточным"
        required: false
        default: "400"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Ставим только браузер: базы и остального проекту здесь не нужно.
      - run: npm i -D playwright@1.55.0 && npx playwright install --with-deps chromium
      # Экран виртуальный: источник узнаёт браузер без экрана и встречает его
      # проверкой «не робот» (проверено 27.08.2026).
      - run: xvfb-run -a node scripts/source-probe.mjs --list="${{ inputs.list }}" --cap="${{ inputs.cap }}"

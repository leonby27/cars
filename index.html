<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Автомобили с пробегом из Китая с проверкой, расчётом стоимости и доставкой в Беларусь." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:title" content="Автомобили из Китая в Беларусь — evcars.by" />
    <meta property="og:description" content="Актуальные объявления, проверка и ориентировочная цена до Минска." />
    <meta property="og:image" content="https://evcars.by/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Автомобили из Китая в Беларусь — evcars.by</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem("evcars-theme");
        const theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#111315" : "#ffffff";
      })();
    </script>
    <script>
      // Start the catalog requests before the application bundle is downloaded and parsed.
      // Waiting for React to mount first put the whole bundle on the critical path of the
      // very first request, which is what the boot loader was mostly waiting for.
      (() => {
        const start = (url) => {
          const request = fetch(url, { cache: "no-store" }).then((response) => (response.ok ? response.json() : Promise.reject(new Error(url))));
          // Nothing awaits these until the bundle boots; keep rejections from going unhandled.
          request.catch(() => {});
          return request;
        };
        const detail = location.pathname.match(/^\/(?:cars|orders\/draft)\/([^/]+)/);
        let id = null;
        try { id = detail ? decodeURIComponent(detail[1]) : null; } catch { id = detail[1]; }
        window.__boot = {
          catalog: start("/api/cars?limit=60&sort=variety"),
          carId: id,
          car: id ? start(`/api/cars/${encodeURIComponent(id)}`) : null,
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

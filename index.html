    <script>
      (() => {

        const theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#111315" : "#ffffff";
      })();

    <script>
      // Start the catalog requests before the application bundle is downloaded and parsed.
      // Waiting for React to mount first put the whole bundle on the critical path of the
      // very first request, which is what the boot loader was mostly waiting for.
      (() => {
        const start = (url) => {
          // Без `cache: "no-store"`: он заставлял браузер добавлять к запросу «не бери
          // из кэша», а по этой пометке сеть Vercel отдаёт мимо своего кэша. Свежесть
          // задаёт сам ответ каталога — там `max-age=0`, то есть браузер своё не хранит.
          const request = fetch(url).then((response) => (response.ok ? response.json() : Promise.reject(new Error(url))));
          // Nothing awaits these until the bundle boots; keep rejections from going unhandled.
          request.catch(() => {});
          return request;
        };
        const detail = location.pathname.match(/^\/(?:cars|orders\/draft)\/([^/]+)/);
        let id = null;
        try { id = detail ? decodeURIComponent(detail[1]) : null; } catch { id = detail[1]; }
        // Список из 60 карточек читают только витрина главной и блок «Похожие
        // автомобили». Каталог отправляет собственный запрос с фильтрами и этот
        // список не открывает, поэтому там просим одну карточку: загрузочного
        // запроса всё равно достаточно, чтобы узнать размер каталога и что база отвечает.
        const showcase = location.pathname !== "/catalog";
        window.__boot = {
          catalog: start(showcase ? "/api/cars?limit=60&sort=variety" : "/api/cars?limit=1&sort=newest"),
          carId: id,
          car: id ? start(`/api/cars/${encodeURIComponent(id)}`) : null,
        };
      })();
    </script>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Автомобили с пробегом из Китая с проверкой, расчётом стоимости и доставкой в Беларусь." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Иконка сайта. SVG — для браузеров, PNG и ICO — для Google: в поиске рядом со
         ссылкой он рисует растровую картинку и надёжнее всего берёт её из привычного
         /favicon.ico или квадратного PNG, кратного 48 точкам. -->
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96.png?v=3" type="image/png" sizes="96x96" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <!-- Ярлык сайта на телефоне: по этому файлу Chrome берёт крупную иконку и
         открывает сайт отдельным окном, без адресной строки браузера. -->
    <link rel="manifest" href="/manifest.json?v=3" />
    <!-- Шрифт интерфейса начинаем скачивать сразу, не дожидаясь файла стилей: иначе
         страница успевает нарисоваться системным шрифтом и текст на первой загрузке
         заметно прыгает. Два файла — кириллица и латиница с цифрами; обе части нужны
         на любой странице сайта. Насыщенности внутри одного файла, отдельных нет.
         `crossorigin` обязателен: без него браузер скачает файл второй раз. -->
    <link rel="preload" href="/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Фотографии машин раньше грузились прямо с китайского хранилища, и здесь стояло
         заблаговременное рукопожатие с ним. Теперь снимки идут со своего адреса
         /photo/… (наш сервер держит их копию, см. imageSource в src/App.jsx), то есть
         по уже открытому соединению с сайтом, — знакомиться с чужим сервером не нужно.
         К нему обращаемся только страховкой, если наша копия почему-то не отдалась. -->
    <meta property="og:title" content="Автомобили из Китая в Беларусь — abcars.by" />
    <meta property="og:description" content="Актуальные объявления, проверка и ориентировочная цена до Минска." />
    <meta property="og:image" content="https://abcars.by/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Автомобили из Китая в Беларусь — abcars.by</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem("abcars-theme");
        const theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#111315" : "#ffffff";
      })();
    </script>
    <!-- Текст для поисковиков сервер кладёт прямо в страницу, и браузер успевает
         нарисовать его раньше, чем загрузится приложение: получается вспышка простой
         вёрстки без стилей сайта. Прячем этот текст, пока приложение не встало.
         Раньше вместе с ним прятался и весь `#root`, то есть страница до запуска
         приложения оставалась пустой: на телефоне это 4 секунды пустого фона.
         Теперь перед текстом стоит готовый первый экран (server/boot-screen.mjs) —
         он и рисуется сразу, а прячется только текст для поисковиков.
         Прячет его лишь браузер с JavaScript: у поисковиков и без скриптов текст
         остаётся на месте. Если приложение почему-то не запустилось, через пять
         секунд текст показывается, а картинка первого экрана убирается — лучше
         простая страница, чем нерабочая. -->
    <style>
      html.booting .seo-body { display: none; }
    </style>
    <script>
      document.documentElement.classList.add("booting");
      setTimeout(() => {
        document.documentElement.classList.remove("booting");
        document.querySelector(".boot-screen")?.remove();
      }, 5000);
    </script>
    <script>
      // Start the catalog requests before the application bundle is downloaded and parsed.
      // Waiting for React to mount first put the whole bundle on the critical path of the
      // very first request, which is what the boot loader was mostly waiting for.
      (() => {
        // Секундный сбой сервера (5xx в момент выкладки) и отказ защиты от наплыва (429)
        // повторяем с паузой — молча, до трёх попыток. Без этого неудача такого запроса
        // уводила приложение на заглушку «идут технические работы»: этот запрос грузит
        // каталог, и приложение подхватывает уже начатое здесь обещание, а не своё.
        const retryable = { 429: 1, 500: 1, 502: 1, 503: 1, 504: 1 };
        const start = (url) => {
          // Без `cache: "no-store"`: он заставлял браузер добавлять к запросу «не бери
          // из кэша», а по этой пометке сеть Vercel отдаёт мимо своего кэша. Свежесть
          // задаёт сам ответ каталога — там `max-age=0`, то есть браузер своё не хранит.
          const attempt = (left) =>
            fetch(url).then(
              (response) => {
                if (response.ok) return response.json();
                if (left > 0 && retryable[response.status]) {
                  const asked = Number(response.headers.get("retry-after"));
                  const pause = asked > 0 ? Math.min(asked * 1000, 5000) : 700 * (3 - left);
                  return new Promise((resolve) => setTimeout(resolve, pause)).then(() => attempt(left - 1));
                }
                return Promise.reject(new Error(url));
              },
              (error) => (left > 0 ? new Promise((resolve) => setTimeout(resolve, 700 * (3 - left))).then(() => attempt(left - 1)) : Promise.reject(error)),
            );
          const request = attempt(2);
          // Nothing awaits these until the bundle boots; keep rejections from going unhandled.
          request.catch(() => {});
          return request;
        };
        const detail = location.pathname.match(/^\/(?:cars|orders\/draft)\/([^/]+)/);
        let id = null;
        try { id = detail ? decodeURIComponent(detail[1]) : null; } catch { id = detail[1]; }
        // Список из 60 карточек читают только витрина главной и блок «Похожие
        // автомобили». Каталог отправляет собственный запрос с фильтрами и этот
        // список не открывает, поэтому там просим одну карточку: загрузочного
        // запроса всё равно достаточно, чтобы узнать размер каталога и что база отвечает.
        const showcase = location.pathname !== "/catalog";
        // Справочник фильтров решает, какие поля показывать (батарею спрашивают у
        // электромобиля, объём двигателя — у бензинового). Если спросить его после
        // того, как соберётся приложение, поля появляются второй волной и панель
        // фильтров достраивается на глазах. Поэтому спрашиваем сразу, вместе с
        // каталогом, а на разделах по типу топлива — с тем же отбором, что у раздела.
        // Спрашиваем только там, где панель фильтров есть с первого экрана: главная,
        // общий каталог и разделы по типу топлива. У разделов марки и кузова отбор
        // знает только приложение — там справочник спрашивается как раньше.
        const metaType = { "/catalog/electric": "Электромобиль", "/catalog/hybrid": "Гибрид", "/catalog/petrol": "ДВС" }[location.pathname];
        const metaWanted = metaType || location.pathname === "/" || location.pathname === "/catalog";
        const metaQuery = metaType ? new URLSearchParams({ type: metaType }).toString() : "";
        const meta = metaWanted ? start(`/api/catalog/meta${metaQuery ? `?${metaQuery}` : ""}`) : null;
        window.__boot = {
          catalog: start(showcase ? "/api/cars?limit=60&sort=variety" : "/api/cars?limit=1&sort=newest"),
          carId: id,
          car: id ? start(`/api/cars/${encodeURIComponent(id)}`) : null,
          metaQuery,
          meta,
        };
        // Готовый ответ кладём рядом: приложение читает его при первой отрисовке,
        // не дожидаясь даже одного лишнего кадра.
        meta?.then((value) => { window.__boot.metaValue = value; }).catch(() => {});
      })();
    </script>
    <script id="yandex-metrika">
      (() => {
        // Яндекс.Метрика считает живых посетителей. Номер лежит в window.__ym:
        // приложение берёт его оттуда для переходов внутри сайта.
        // `/analytics` — внутренняя CRM, а не страница сайта. На прямом входе не
        // создаём даже очередь счётчика: ни просмотр, ни Webvisor не должны начаться.
        const page = location.pathname.replace(/\/+$/, '') || '/';
        if (page === '/analytics' || page.startsWith('/analytics/')) return;
        const host = location.hostname;
        if (/^(localhost|127\.0\.0\.1|\[?::1\]?|.*\.local)$/i.test(host) || /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(host)) return;
        // Свои заходы с обычного адреса сайта тоже можно не считать: откройте любую
        // страницу с добавкой ?nocount=1 — браузер запомнит это насовсем и счётчик в нём
        // больше не подключится. Вернуть учёт — ?nocount=0. Метка живёт в самом браузере,
        // поэтому её нужно поставить отдельно на каждом устройстве.
        try {
          const choice = new URLSearchParams(location.search).get('nocount');
          if (choice === '1') localStorage.setItem('nocount', '1');
          else if (choice === '0') localStorage.removeItem('nocount');
          if (localStorage.getItem('nocount') === '1') return;
        } catch (error) {
          // Приватный режим может запрещать хранилище — тогда считаем как обычно.
        }
        // Браузеры, которыми управляет программа (автоматические проверки, роботы,
        // мои собственные заходы через такой браузер), сами о себе сообщают — их
        // в статистику тоже не берём.
        if (navigator.webdriver || /bot|claude\/|crawl|spider|slurp|scrape|headless|phantom|puppeteer|playwright|selenium|lighthouse|pagespeed|preview|fetcher|archiver|monitor/i.test(navigator.userAgent)) return;
        window.__ym = 111868764;
        // Очередь вызовов ставим сразу, а сам скрипт счётчика подключаем позже. Причина:
        // на телефоне tag.js занимает основной поток 2,2 секунды — вшестеро дольше всего
        // нашего кода, — и всё это время страница не может дорисоваться. Заходы при этом
        // не теряются: очередь ждёт скрипт, а он подключается, как только страница
        // загрузилась (или сразу, если посетитель тронул экран раньше).
        window.ym = window.ym || function(){(window.ym.a = window.ym.a || []).push(arguments)};
        window.ym.l = 1 * new Date();
        ym(111868764, 'init', {ssr:true, webvisor:true, clickmap:true, ecommerce:"dataLayer", referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});

        const src = 'https://mc.yandex.ru/metrika/tag.js?id=111868764';
        let started = false;
        const startCounter = () => {
          if (started) return;
          started = true;
          const tag = document.createElement('script');
          tag.async = 1;
          tag.src = src;
          document.head.appendChild(tag);
        };
        const soon = () => (window.requestIdleCallback ? requestIdleCallback(startCounter, { timeout: 1500 }) : setTimeout(startCounter, 300));
        if (document.readyState === 'complete') soon();
        else addEventListener('load', soon, { once: true });
        // Любое действие посетителя — повод не ждать полной загрузки: щелчок или
        // прокрутка должны попасть в статистику.
        for (const event of ['pointerdown', 'keydown', 'touchstart', 'scroll']) {
          addEventListener(event, startCounter, { once: true, passive: true });
        }
      })();
    </script>
    <script id="google-analytics">
      (() => {
        // Google Analytics дополняет Метрику отчётами по каналам и поведению. У него
        // те же исключения: CRM, локальная разработка, свои визиты и автоматические
        // проверки не должны искажать результат теста идеи.
        const page = location.pathname.replace(/\/+$/, '') || '/';
        if (page === '/analytics' || page.startsWith('/analytics/')) return;
        const host = location.hostname;
        if (/^(localhost|127\.0\.0\.1|\[?::1\]?|.*\.local)$/i.test(host) || /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(host)) return;
        try {
          const choice = new URLSearchParams(location.search).get('nocount');
          if (choice === '1') localStorage.setItem('nocount', '1');
          else if (choice === '0') localStorage.removeItem('nocount');
          if (localStorage.getItem('nocount') === '1') return;
        } catch (error) {
          // Если хранилище недоступно, счётчик работает как при обычном визите.
        }
        if (navigator.webdriver || /bot|claude\/|crawl|spider|slurp|scrape|headless|phantom|puppeteer|playwright|selenium|lighthouse|pagespeed|preview|fetcher|archiver|monitor/i.test(navigator.userAgent)) return;

        const id = 'G-964NJY891X';
        window.__ga = id;
        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function(){window.dataLayer.push(arguments)};
        window.gtag('js', new Date());
        // Рекламные сигналы для проверки MVP не нужны: собираем только статистику
        // посещений и конверсий, без персонализации рекламы. Просмотры отправляем
        // сами: так переходы приложения и быстрый просмотр не считаются дважды.
        window.gtag('config', id, { send_page_view:false, allow_google_signals:false, allow_ad_personalization_signals:false });
        window.gtag('event', 'page_view', { page_location:location.href, page_title:document.title, send_to:id });

        let started = false;
        const startCounter = () => {
          // Переход в CRM до отложенной загрузки отменяет запуск счётчика.
          if (started || window.__ga !== id) return;
          started = true;
          const tag = document.createElement('script');
          tag.id = 'google-analytics-library';
          tag.async = 1;
          tag.src = `https://www.googletagmanager.com/gtag/js?id=${id}`;
          document.head.appendChild(tag);
        };
        const soon = () => (window.requestIdleCallback ? requestIdleCallback(startCounter, { timeout:1500 }) : setTimeout(startCounter, 300));
        if (document.readyState === 'complete') soon();
        else addEventListener('load', soon, { once:true });
        for (const event of ['pointerdown', 'keydown', 'touchstart', 'scroll']) {
          addEventListener(event, startCounter, { once:true, passive:true });
        }
      })();
    </script>
  </head>
  <body>
    <!-- Картинка-счётчик для браузеров без JavaScript. В <head> её держать нельзя —
         сборщик считает это ошибкой разметки, поэтому она стоит здесь. -->
    <noscript id="yandex-metrika-noscript"><div><img src="https://mc.yandex.ru/watch/111868764" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

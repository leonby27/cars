services:
  postgres:
    image: postgres:17-alpine
    # Docker по умолчанию даёт контейнеру 64 МБ общей памяти (/dev/shm). Postgres
    # кладёт туда промежуточные наборы параллельных запросов, и на полном каталоге
    # нескольких одновременных обращений хватало, чтобы получить «no space left on
    # device» — каталог отвечал ошибкой, а страница показывала ноль машин.
    shm_size: 1gb
    environment:
      POSTGRES_DB: chinacar
      POSTGRES_USER: chinacar
      POSTGRES_PASSWORD: chinacar
    ports:
      - "54329:5432"
    volumes:
      - chinacar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chinacar -d chinacar"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  chinacar_postgres:
